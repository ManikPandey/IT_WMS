name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # We need services for the tests to pass (Postgres and Redis)
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: core_db
        ports:
          - 5432:5432
      postgres_inventory:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: inventory_db
        ports:
          - 5433:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'
        
    - name: Setup Core Database
      run: |
        cd core-service
        npm ci
        npx prisma db push
      env:
        DATABASE_URL: "postgresql://user:password@127.0.0.1:5432/core_db?schema=public"

    - name: Setup Inventory Database
      run: |
        cd inventory-service
        npm ci
        npx prisma db push
      env:
        DATABASE_URL: "postgresql://user:password@127.0.0.1:5433/inventory_db?schema=public"

    - name: Install & Test Core Service
      run: |
        cd inventory-service
        (
          export DATABASE_URL="postgresql://user:password@127.0.0.1:5433/inventory_db?schema=public"
          export REDIS_URL="redis://127.0.0.1:6379"
          export PORT="3001"
          export ENABLE_SEED="true"
          npm start &
        )
        sleep 5
        cd ../core-service
        npm ci
        npm test
      env:
        DATABASE_URL: "postgresql://user:password@127.0.0.1:5432/core_db?schema=public"
        REDIS_URL: "redis://127.0.0.1:6379"
        INVENTORY_SERVICE_URL: "http://127.0.0.1:3001"

    - name: Install & Test Inventory Service
      run: |
        cd inventory-service
        npm ci
        npm test
      env:
        DATABASE_URL: "postgresql://user:password@127.0.0.1:5433/inventory_db?schema=public"
        REDIS_URL: "redis://127.0.0.1:6379"
