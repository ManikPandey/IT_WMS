version: '3.8'
services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  core_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: core_db
    ports:
      - "5432:5432"

  inventory_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: inventory_db
    ports:
      - "5433:5432"

  inventory_service:
    build: 
      context: ./inventory-service
    environment:
      - DATABASE_URL=postgresql://user:password@inventory_db:5432/inventory_db
      - REDIS_URL=redis://redis:6379
      - PORT=3001
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    deploy:
      replicas: 3
    depends_on:
      - inventory_db
      - redis

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "4000:4000"
    depends_on:
      - inventory_service

  # core_service omitted from this specific horizontal scaling test
  # as requested to focus solely on inventory-service scaling proof.
